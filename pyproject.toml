[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provensql"
version = "0.1.0"
description = "Sound-by-construction semantic diff for SQL: know whether a query edit changes the answer."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Nachiket Lele" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
# Upper bounds prevent silent verdict drift: sqlglot's canonicalization can
# change between majors, which would change Stage 1/2 results and make the
# published eval numbers non-reproducible. Measured on sqlglot 30.14.0,
# duckdb 1.5.5, z3-solver 5.0.0.0.
dependencies = [
    "sqlglot>=30.0,<31",
    "duckdb>=1.5,<2",
    "pyyaml>=6.0,<7",
    "z3-solver>=4.13,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Repository = "https://github.com/nac7/provensql"

[project.scripts]
provensql = "provensql.cli:main"

[tool.setuptools.packages.find]
include = ["provensql*"]
